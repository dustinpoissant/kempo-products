# Database for kempo-products' own test suite. Ports 5433-5440 and 5442 are taken by the other
# kempo repos' databases, so this one takes 5443.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kempo-products-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kempo
      POSTGRES_PASSWORD: kempo
      POSTGRES_DB: kempo_products_test
    ports:
      - "5443:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kempo"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_test_data:
