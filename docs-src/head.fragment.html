<fragment>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="A product catalog for kempo cms: browse, filter and search products with no checkout required, and connect them to inventory." />
  <link rel="icon" type="image/svg+xml" href="./media/icon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/kempo-css@2/dist/kempo.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/kempo-css@2/dist/kempo-hljs.min.css" />
  <script>
    window.kempo = {
      pathToStylesheet: 'https://cdn.jsdelivr.net/npm/kempo-css@2/dist/kempo.min.css',
      pathsToIcons: ['https://cdn.jsdelivr.net/npm/kempo-ui@0.5/icons']
    };
  </script>
  <style>
    [id] { scroll-margin-top: 5rem; }
  </style>
  <location name="styles"></location>
</fragment>
