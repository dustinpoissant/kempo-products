<page title="Product Template - Admin">
<content>
  <script type="module" src="/kempo-ui/components/Icon.js"></script>
  <script type="module" src="/kempo-ui/components/Tabs.js"></script>
  <script type="module" src="/products/components/TemplateForm.js"></script>
  <script type="module" src="/products/components/ProductSaveButton.js"></script>
  <script type="module" src="/products/components/TemplateDetailsTab.js"></script>
  <script type="module" src="/products/components/TemplateProductTab.js"></script>
  <script type="module" src="/products/components/TemplateOptionsTab.js"></script>
  <script type="module" src="/products/components/TemplateAttributesTab.js"></script>
  <script type="module" src="/products/components/TemplateDefaultsTab.js"></script>

  <div class="d-f mb" style="align-items: center; gap: var(--spacer);">
    <a href="/admin/extension/kempo-products/#templates" class="btn"><k-icon name="arrow" direction="left"></k-icon> Products</a>
    <h1 class="flex mb0">Product Template</h1>
  </div>

  <!-- ?key= is the template being edited; without it a new template is made. One Save above the tabs saves everything. -->
  <k-products-template-form from-url>
    <div class="d-f mb"><k-products-save-button></k-products-save-button></div>
    <k-tabs active="details" hash-routing>
      <k-tab for="details">Details</k-tab>
      <k-tab for="product">Product</k-tab>
      <k-tab for="options">Options</k-tab>
      <k-tab for="attributes">Attributes</k-tab>
      <k-tab for="defaults">Defaults</k-tab>

      <k-tab-content name="details" class="pt"><k-products-template-details-tab></k-products-template-details-tab></k-tab-content>
      <k-tab-content name="product" class="pt"><k-products-template-product-tab></k-products-template-product-tab></k-tab-content>
      <k-tab-content name="options" class="pt"><k-products-template-options-tab></k-products-template-options-tab></k-tab-content>
      <k-tab-content name="attributes" class="pt"><k-products-template-attributes-tab></k-products-template-attributes-tab></k-tab-content>
      <k-tab-content name="defaults" class="pt"><k-products-template-defaults-tab></k-products-template-defaults-tab></k-tab-content>

      <location name="products-admin-template-tabs"></location>
    </k-tabs>
  </k-products-template-form>
</content>
</page>
