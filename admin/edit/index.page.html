<page title="Edit Product - Admin">
<content>
  <script type="module" src="/kempo-ui/components/Icon.js"></script>

  <div class="d-f mb" style="align-items: center; gap: var(--spacer);">
    <a href="/admin/extension/kempo-products/" class="btn"><k-icon name="arrow" direction="left"></k-icon> Products</a>
    <h1 class="flex mb0">Edit Product</h1>
  </div>

  <div id="formHost"></div>

  <script type="module">
    import { safeNext } from '/products/components/ProductForm.js';

    /* ?id= is the product; ?next= (a path on this site) is where to go after saving or cancelling. */
    const params = new URLSearchParams(location.search);
    const $form = document.createElement('k-prod-form');
    $form.setAttribute('product-id', params.get('id') ?? '');
    $form.setAttribute('next', safeNext(params.get('next'), '/admin/extension/kempo-products/'));
    document.getElementById('formHost').append($form);
  </script>
</content>
</page>
