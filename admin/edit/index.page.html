<page title="Edit Product - Admin">
<content>
  <script type="module" src="/kempo-ui/components/Icon.js"></script>
  <script type="module" src="/products/components/ProductForm.js"></script>

  <div class="d-f mb" style="align-items: center; gap: var(--spacer);">
    <a href="/admin/extension/kempo-products/" class="btn"><k-icon name="arrow" direction="left"></k-icon> Products</a>
    <h1 class="flex mb0">Edit Product</h1>
  </div>

  <!--
    ?id= is the product; ?next= (a path on this site) is where to go after saving or cancelling.
    Extensions add a panel with a fragment named products-admin-product-panels; see the new page.
  -->
  <k-prod-form from-url>
    <div slot="panels"><fragment name="products-admin-product-panels"></fragment></div>
  </k-prod-form>
</content>
</page>
